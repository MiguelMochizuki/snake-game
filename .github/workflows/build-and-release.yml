name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runs-on: ubuntu-24.04
            artifact-name: snake-linux-x86_64
            binary-path: build/bin/snake
            final-name: snake-linux-x86_64
            cmake-generator: Ninja
          - name: Linux ARM64
            runs-on: ubuntu-24.04-arm
            artifact-name: snake-linux-arm64
            binary-path: build/bin/snake
            final-name: snake-linux-arm64
            cmake-generator: Ninja
          - name: Windows x86-64
            runs-on: windows-2022
            artifact-name: snake-windows-x86_64
            binary-path: build/bin/Release/snake.exe
            final-name: snake-windows-x86_64.exe
            cmake-generator: Visual Studio
            cmake-arch: x64
          - name: Windows ARM64
            runs-on: windows-11-arm
            artifact-name: snake-windows-arm64
            binary-path: build/bin/Release/snake.exe
            final-name: snake-windows-arm64.exe
            cmake-generator: Visual Studio
            cmake-arch: ARM64
          - name: macOS Universal
            runs-on: macos-15
            artifact-name: snake-macos-universal
            binary-path: build/bin/snake
            final-name: snake-macos-universal
            cmake-generator: Ninja
            osx-architectures: "x86_64;arm64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux' && matrix.cmake-generator == 'Ninja'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja

      - name: Configure CMake
        shell: bash
        run: |
          cmake_args=(
            -S .
            -B build
            -DCMAKE_BUILD_TYPE=Release
            -DSNAKE_GAME_BUILD_AUDIO=ON
          )

          if [ "${{ matrix.cmake-generator }}" = "Visual Studio" ]; then
            # Let CMake pick the newest Visual Studio installed on the runner
            cmake_args+=(-A "${{ matrix.cmake-arch }}")
          else
            cmake_args+=(-G "${{ matrix.cmake-generator }}")
          fi

          if [ -n "${{ matrix.osx-architectures }}" ]; then
            cmake_args+=(-DCMAKE_OSX_ARCHITECTURES="${{ matrix.osx-architectures }}")
          fi

          cmake "${cmake_args[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Show architecture
        shell: bash
        run: |
          uname -m || true
          echo "PROCESSOR_ARCHITECTURE=${PROCESSOR_ARCHITECTURE:-}"

      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python3 --version
            ctest --test-dir build -C Release --output-on-failure -LE e2e
            ctest --test-dir build -C Release --output-on-failure -L e2e --no-tests=error
          else
            ctest --test-dir build -C Release --output-on-failure
          fi

      - name: Rename binary
        shell: bash
        run: |
          if [ -f "${{ matrix.binary-path }}" ]; then
            cp "${{ matrix.binary-path }}" "${{ matrix.final-name }}"
          else
            echo "Binary not found at ${{ matrix.binary-path }}"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.final-name }}
          if-no-files-found: error

  gui:
    name: GUI ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runs-on: ubuntu-24.04
            target: linux
            appimagetool-arch: x86_64
            appimagetool-sha256: 46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1
            binary-path: build/bin/snake-gui
            final-name: snake-gui-linux-x86_64.AppImage
            cmake-generator: Ninja
          - name: Linux ARM64
            runs-on: ubuntu-24.04-arm
            target: linux
            appimagetool-arch: aarch64
            appimagetool-sha256: 04f45ea45b5aa07bb2b071aed9dbf7a5185d3953b11b47358c1311f11ea94a96
            binary-path: build/bin/snake-gui
            final-name: snake-gui-linux-arm64.AppImage
            cmake-generator: Ninja
          - name: Windows x86-64
            runs-on: windows-2022
            target: windows
            binary-path: build/bin/Release/snake-gui.exe
            final-name: snake-gui-windows-x86_64.zip
            cmake-generator: Visual Studio
            cmake-arch: x64
          - name: Windows ARM64
            runs-on: windows-11-arm
            target: windows
            binary-path: build/bin/Release/snake-gui.exe
            final-name: snake-gui-windows-arm64.zip
            cmake-generator: Visual Studio
            cmake-arch: ARM64
          - name: macOS Universal
            runs-on: macos-15
            target: macos
            binary-path: build/bin/snake-gui
            final-name: snake-gui-macos-universal.zip
            cmake-generator: Ninja
            osx-architectures: "x86_64;arm64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build desktop-file-utils \
            libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev libegl-dev libdrm-dev libgbm-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev libxfixes-dev libxkbcommon-x11-dev \
            libasound2-dev libpulse-dev libudev-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure CMake
        shell: bash
        run: |
          cmake_args=(
            -S .
            -B build
            -DCMAKE_BUILD_TYPE=Release
            -DSNAKE_GAME_BUILD_GUI=ON
          )

          if [ "${{ matrix.cmake-generator }}" = "Visual Studio" ]; then
            # Static C runtime so the exe runs without the Visual C++ Redistributable
            cmake_args+=(-A "${{ matrix.cmake-arch }}" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded)
          else
            cmake_args+=(-G "${{ matrix.cmake-generator }}")
          fi

          if [ -n "${{ matrix.osx-architectures }}" ]; then
            cmake_args+=(-DCMAKE_OSX_ARCHITECTURES="${{ matrix.osx-architectures }}")
          fi

          cmake "${cmake_args[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install appimagetool (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-${{ matrix.appimagetool-arch }}.AppImage
          echo "${{ matrix.appimagetool-sha256 }}  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      - name: Package
        shell: bash
        run: |
          version=$(sed -n 's/^project(snake_game VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          bash tools/package.sh "${{ matrix.target }}" "${{ matrix.binary-path }}" "$version" dist
          case "${{ matrix.target }}" in
            linux) cp dist/Snake-*.AppImage "${{ matrix.final-name }}" ;;
            windows) cp dist/snake-gui-windows.zip "${{ matrix.final-name }}" ;;
            macos) cp dist/snake-gui-macos.zip "${{ matrix.final-name }}" ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.final-name }}
          path: ${{ matrix.final-name }}
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, gui]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts from build job
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Validate artifacts
        run: |
          echo "Artifacts found:"
          if [ ! -d artifacts ] || [ -z "$(find artifacts -type f -print -quit)" ]; then
            echo "No artifacts were downloaded. Ensure build artifacts exist for this release/tag."
            exit 1
          fi
          find artifacts -type f -exec ls -lh {} \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false

  docker-publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: miguelmochizuki/snake-game
          tags: |
            type=semver,pattern={{raw}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SNAKE_E2E_TIMEOUT_SCALE=10
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: miguelmochizuki/snake-game
          readme-filepath: ./DOCKER_HUB.md
